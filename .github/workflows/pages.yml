name: 每日更新并发布网站

on:
  push:
    branches: [main]
  schedule:
    - cron: "30 8 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: 获取网站代码
        uses: actions/checkout@v4
      - name: 准备 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: 安装依赖
        run: npm ci
      - name: 获取最新股票行情
        run: npm run update:data
      - name: 生成静态网站
        run: npm run build:pages
      - name: 上传网站文件
        uses: actions/upload-pages-artifact@v3
        with:
          path: out
      - name: 发布 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
